<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULEZ Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }
    input {
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px;
      background-color: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e7f4e4;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
    }
    .error {
      background: #ffe0e0;
      border: 1px solid #f5c2c2;
    }
    .toggle-json {
      cursor: pointer;
      margin-top: 10px;
      color: #0077cc;
      text-decoration: underline;
    }
    pre {
      background: #222;
      color: #eee;
      padding: 10px;
      overflow-x: auto;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ULEZ Checker</h1>
    <label for="plateInput">Enter UK Number Plate:</label>
    <input type="text" id="plateInput" placeholder="e.g. J27 STO" />
    <button onclick="checkULEZ()">Check ULEZ Status</button>
    <div id="result" class="result" style="display: none;"></div>
    <div class="toggle-json" onclick="toggleJSON()">Show raw JSON ↓</div>
    <pre id="jsonOutput"></pre>
  </div>

  <script>
    async function checkULEZ() {
      const input = document.getElementById("plateInput").value.trim().replace(/\s+/g, '');
      const resultDiv = document.getElementById("result");
      const jsonOutput = document.getElementById("jsonOutput");
      const toggleLink = document.querySelector(".toggle-json");
      
      resultDiv.style.display = 'none';
      jsonOutput.style.display = 'none';
      toggleLink.innerText = 'Show raw JSON ↓';
      resultDiv.className = 'result';
      resultDiv.innerHTML = 'Loading...';
      resultDiv.style.display = 'block';

      try {
        const response = await fetch('https://mobileapim.tfl.gov.uk/Prod/unirucCapitaFacade/VRMLookup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            vrmLookupRequest: {
              vRM: input,
              country: "UK",
              date: {}
            }
          })
        });

        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();
        const details = data.vrmLookupResponse?.vehicleDetails;
        const exempt = details?.isULEZExempt === 1;

        if (details) {
          resultDiv.innerHTML = `
            <strong>ULEZ Status:</strong> ${exempt ? '<span style="color:green">Exempt ✅</span>' : '<span style="color:red">Not Exempt ❌</span>'}<br>
            <strong>VRM:</strong> ${details.vRM}<br>
            <strong>Make:</strong> ${details.make}<br>
            <strong>Model:</strong> ${details.model}<br>
            <strong>Colour:</strong> ${details.colour}
          `;
        } else {
          resultDiv.classList.add('error');
          resultDiv.innerHTML = 'Vehicle details not found.';
        }

        jsonOutput.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultDiv.classList.add('error');
        resultDiv.innerHTML = 'Error retrieving ULEZ information.';
        jsonOutput.textContent = error.toString();
      }
    }

    function toggleJSON() {
      const json = document.getElementById("jsonOutput");
      const toggleLink = document.querySelector(".toggle-json");
      if (json.style.display === "none") {
        json.style.display = "block";
        toggleLink.innerText = 'Hide raw JSON ↑';
      } else {
        json.style.display = "none";
        toggleLink.innerText = 'Show raw JSON ↓';
      }
    }
  </script>
</body>
</html>
